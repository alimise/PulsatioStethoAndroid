name: Build PulsatioStetho APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: PulsatioStethoAndroid

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu Android images already include an Android SDK.
      # Avoid android-actions/setup-android@v3, which failed while installing 'tools'.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" || { echo 'Android SDK not found'; exit 1; }
          ls "$ANDROID_HOME/platforms" || true
          test -d "$ANDROID_HOME/platforms/android-34" || { echo 'Android SDK platform 34 is missing'; exit 1; }
          test -d "$ANDROID_HOME/build-tools" || { echo 'Android build-tools are missing'; exit 1; }

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PulsatioStetho-APK
          path: PulsatioStethoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
